services:
  postgres:
    image: postgres:16-alpine
    container_name: dyxerplat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dyxerplat
      POSTGRES_USER: dyxerplat
      POSTGRES_PASSWORD: dyxerplat_dev
    ports:
      - "5433:5432"
    volumes:
      - dyxerplat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyxerplat -d dyxerplat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dyxerplat_postgres_data:
